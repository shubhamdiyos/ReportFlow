name: CI - Continuous Integration

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Build and Type Check
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: '**/package.json'
      
      - name: Install dependencies
        run: |
          cd report_frontend
          npm ci
      
      - name: TypeScript type check
        run: |
          cd report_frontend
          npm run check
      
      - name: Build project
        run: |
          cd report_frontend
          npm run build
        env:
          NODE_ENV: production
      
      - name: Check build output
        run: |
          if [ ! -d "report_frontend/dist/public" ]; then
            echo "Build failed: dist/public directory not found"
            exit 1
          fi
          echo "Build successful: dist/public directory exists"
      
      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.node-version }}
          path: report_frontend/dist
          retention-days: 7
  
  lint-check:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: '**/package.json'
      
      - name: Install dependencies
        run: |
          cd report_frontend
          npm ci
      
      - name: Check for package vulnerabilities
        run: |
          cd report_frontend
          npm audit --audit-level=high || true
      
      - name: Verify package-lock.json is up to date
        run: |
          cd report_frontend
          npm install --package-lock-only
          git diff --exit-code package-lock.json || (echo "package-lock.json is outdated" && exit 1)
