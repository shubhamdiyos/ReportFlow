name: Deploy ReportFlow to AWS

on:
  push:
    branches: [ main, develop ]
    paths: [ 'report_backend/**' ]
  pull_request:
    branches: [ main ]
    paths: [ 'report_backend/**' ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
    
    - name: Run tests
      working-directory: ./report_backend
      run: mvn clean test
    
    - name: Build application
      working-directory: ./report_backend
      run: mvn clean package -DskipTests

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
    
    - name: Build application
      working-directory: ./report_backend
      run: mvn clean package -DskipTests
    
    - name: Deploy to AWS EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd ~/reportflow
          
          # Stop existing application
          pkill -f reportflow-backend || true
          
          # Backup current version
          cp reportflow-backend-1.0.0.jar reportflow-backend-1.0.0.jar.backup || true
          
          # Copy new JAR (this will be uploaded via SCP)
          # The new JAR will be copied before this script runs
          
          # Restart with new JAR
          DATABASE_URL=jdbc:postgresql://localhost:5433/reportflow \
          DB_USERNAME=reportflow_user \
          DB_PASSWORD=reportflow_password \
          SPRING_PROFILES_ACTIVE=aws \
          AWS_BACKEND_URL=http://13.232.117.123:8080 \
          FRONTEND_URL=http://13.232.117.123:3000 \
          GITHUB_CLIENT_ID=${{ secrets.GITHUB_CLIENT_ID }} \
          GITHUB_CLIENT_SECRET=${{ secrets.GITHUB_CLIENT_SECRET }} \
          nohup java -jar reportflow-backend-1.0.0.jar > app.log 2>&1 &
          
          # Wait for application to start
          sleep 15
          
          # Health check
          curl -f http://localhost:8080/actuator/health || exit 1
          
          echo "✅ ReportFlow deployed successfully!"

    - name: Upload JAR to EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "report_backend/target/reportflow-backend-1.0.0.jar"
        target: "~/reportflow/"
        strip_components: 2

  notify:
    needs: [test, deploy]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Deployment Status
      run: |
        if [ "${{ needs.deploy.result }}" == "success" ]; then
          echo "✅ ReportFlow deployed to AWS successfully!"
          echo "🌐 URL: http://13.232.117.123:8080"
        else
          echo "❌ Deployment failed"
        fi
