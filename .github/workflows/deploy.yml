name: 🚀 Deploy ReportFlow

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: ☕ Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: 🔨 Build Application
      working-directory: ./report_backend
      run: mvn clean package -DskipTests
      
    - name: 📤 Upload JAR to EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: 65.1.106.112
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "report_backend/target/reportflow-backend-1.0.0.jar"
        target: "~/app/"
        
    - name: 🚀 Deploy on EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: 65.1.106.112
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd ~/app
          
          # Stop existing app
          pkill -f reportflow-backend || true
          sleep 3
          
          # Start new app
          export DATABASE_URL="jdbc:postgresql://localhost:5433/reportflow"
          export DB_USERNAME="reportflow_user"
          export DB_PASSWORD="reportflow_password"
          export JWT_SECRET="${{ secrets.JWT_SECRET }}"
          export GITHUB_CLIENT_ID="${{ secrets.GITHUB_CLIENT_ID }}"
          export GITHUB_CLIENT_SECRET="${{ secrets.GITHUB_CLIENT_SECRET }}"
          export FRONTEND_URL="${{ secrets.FRONTEND_URL }}"
          export SPRING_PROFILES_ACTIVE=aws
          
          echo "🚀 Starting ReportFlow..."
          nohup java -jar reportflow-backend-1.0.0.jar > app.log 2>&1 &
          
          sleep 10
          
          if pgrep -f reportflow-backend > /dev/null; then
            echo "✅ Deployment successful!"
            echo "🌐 http://65.1.106.112:8080"
          else
            echo "❌ Deployment failed!"
            tail -20 app.log
            exit 1
          fi
