name: 🚀 Deploy ReportFlow

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: ☕ Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: 🔨 Build Application
      working-directory: ./report_backend
      run: mvn clean package -DskipTests
      
    - name: Add deploy key
      run: |
        echo "${{ secrets.DEPLOY_KEY }}" > deploy_key.pem
        chmod 600 deploy_key.pem
        # Verify key exists and is not empty
        if [ ! -s deploy_key.pem ]; then
          echo "❌ DEPLOY_KEY secret is empty or not set"
          exit 1
        fi
        echo "✅ SSH key loaded successfully"
        
    - name: Copy files to server
      run: |
        ssh -i deploy_key.pem -o StrictHostKeyChecking=no \
          ec2-user@65.1.106.112 'mkdir -p ~/app'
        scp -i deploy_key.pem -o StrictHostKeyChecking=no \
          report_backend/target/reportflow-backend-1.0.0.jar \
          ec2-user@65.1.106.112:~/app/
        
    - name: Deploy on EC2
      run: |
        ssh -i deploy_key.pem -o StrictHostKeyChecking=no \
          ec2-user@65.1.106.112 'mkdir -p ~/app && \
          cd ~/app && \
          pkill -f reportflow-backend || true && \
          sleep 3 && \
          sudo fuser -k 8080/tcp 2>/dev/null || true && \
          sleep 2 && \
          export DATABASE_URL="jdbc:postgresql://localhost:5433/reportflow" && \
          export DB_USERNAME="reportflow_user" && \
          export DB_PASSWORD="reportflow_password" && \
          export JWT_SECRET="${{ secrets.JWT_SECRET }}" && \
          export GITHUB_CLIENT_ID="${{ secrets.CLIENT_ID }}" && \
          export GITHUB_CLIENT_SECRET="${{ secrets.CLIENT_SECRET }}" && \
          export FRONTEND_URL="${{ secrets.FRONTEND_URL }}" && \
          export SPRING_PROFILES_ACTIVE=aws && \
          echo "🚀 Starting ReportFlow..." && \
          timeout 20 java -jar reportflow-backend-1.0.0.jar > app.log 2>&1 & \
          sleep 18 && \
          if pgrep -f reportflow-backend > /dev/null; then \
            echo "✅ Deployment successful!"; \
            echo "🌐 http://65.1.106.112:8080"; \
          else \
            echo "❌ Deployment failed!"; \
            echo "=== Last 20 lines of app.log ==="; \
            tail -20 app.log || echo "No app.log found"; \
            echo "=== Process list ==="; \
            ps aux | grep java || echo "No Java processes"; \
            echo "=== Port 8080 status ==="; \
            sudo ss -tlnp | grep 8080 || echo "Port 8080 not listening"; \
            exit 1; \
          fi'
