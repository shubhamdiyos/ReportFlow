name: 🚀 Build and Deploy ReportFlow

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4
      
    - name: ☕ Setup Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: 🔨 Build Application
      working-directory: ./report_backend
      run: mvn clean package -DskipTests
      
    - name: Add deploy key
      run: |
        echo "${{ secrets.DEPLOY_KEY }}" > deploy_key.pem
        chmod 600 deploy_key.pem
        # Verify key exists and is not empty
        if [ ! -s deploy_key.pem ]; then
          echo "❌ DEPLOY_KEY secret is empty or not set"
          exit 1
        fi
        echo "✅ SSH key loaded successfully"
        
    - name: 📦 Copy JAR to EC2
      run: |
        ssh -i deploy_key.pem -o StrictHostKeyChecking=no \
          ec2-user@65.1.106.112 'mkdir -p ~/app'
        scp -i deploy_key.pem -o StrictHostKeyChecking=no \
          report_backend/target/reportflow-backend-1.0.0.jar \
          ec2-user@65.1.106.112:~/app/
        echo "✅ JAR file copied to EC2 successfully"
        echo "🔧 To deploy manually on EC2:"
        echo "   ssh -i your_key.pem ec2-user@65.1.106.112"
        echo "   cd ~/app"
        echo "   # Check which port is listening and kill it"
        echo "   sudo ss -tlnp | grep 8080"
        echo "   sudo fuser -k 8080/tcp"
        echo "   # Deploy with nohup"
        echo "   export DATABASE_URL=\"jdbc:postgresql://localhost:5433/reportflow\""
        echo "   export DB_USERNAME=\"reportflow_user\""
        echo "   export DB_PASSWORD=\"reportflow_password\""
        echo "   export JWT_SECRET=\"your_jwt_secret\""
        echo "   export GITHUB_CLIENT_ID=\"your_client_id\""
        echo "   export GITHUB_CLIENT_SECRET=\"your_client_secret\""
        echo "   export FRONTEND_URL=\"http://localhost:3000\""
        echo "   export SPRING_PROFILES_ACTIVE=aws"
        echo "   nohup java -jar reportflow-backend-1.0.0.jar > app.log 2>&1 &"
        echo "   sleep 10 && tail -10 app.log"
