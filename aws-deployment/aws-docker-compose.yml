version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: reportflow-postgres
    environment:
      POSTGRES_DB: reportflow
      POSTGRES_USER: reportflow_user
      POSTGRES_PASSWORD: reportflow_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - reportflow-network
    restart: unless-stopped

  # ReportFlow Backend Application
  backend:
    build:
      context: ./report_backend
      dockerfile: Dockerfile
    container_name: reportflow-backend
    environment:
      - SPRING_PROFILES_ACTIVE=aws
      - DATABASE_URL=jdbc:postgresql://postgres:5432/reportflow
      - DB_USERNAME=reportflow_user
      - DB_PASSWORD=reportflow_password
      - JWT_SECRET=2YrMZR3BqiU6N18gcgfRX23cIiDiusL4TRbAq912uf5+lPiTPWW6y+vu7WD8Uex7GN5aRIPYsKvpsAvAbi1qxg==
      - AWS_BACKEND_URL=http://65.0.109.47:8080
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - FRONTEND_URL=http://65.0.109.47:3000
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - reportflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: reportflow-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - backend
    networks:
      - reportflow-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  reportflow-network:
    driver: bridge
