version: '3.8'

services:
  # ReportFlow PostgreSQL Database
  reportflow-postgres:
    image: postgres:15-alpine
    container_name: reportflow-postgres
    environment:
      POSTGRES_DB: reportflow
      POSTGRES_USER: reportflow_user
      POSTGRES_PASSWORD: reportflow_password
    ports:
      - "5433:5432"
    volumes:
      - reportflow_postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - reportflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reportflow_user -d reportflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ReportFlow Backend Application
  reportflow-backend:
    image: eclipse-temurin:17-jre-alpine
    container_name: reportflow-backend
    working_dir: /app
    command: ["java", "-jar", "reportflow-backend-1.0.0.jar"]
    environment:
      - SPRING_PROFILES_ACTIVE=aws
      - DATABASE_URL=jdbc:postgresql://reportflow-postgres:5432/reportflow
      - DB_USERNAME=reportflow_user
      - DB_PASSWORD=reportflow_password
      - JWT_SECRET=2YrMZR3BqiU6N18gcgfRX23cIiDiusL4TRbAq912uf5+lPiTPWW6y+vu7WD8Uex7GN5aRIPYsKvpsAvAbi1qxg==
      - AWS_BACKEND_URL=http://13.232.117.123:8080
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - FRONTEND_URL=http://13.232.117.123:3000
    ports:
      - "8080:8080"
    volumes:
      - ./reportflow-backend-1.0.0.jar:/app/reportflow-backend-1.0.0.jar
    depends_on:
      reportflow-postgres:
        condition: service_healthy
    networks:
      - reportflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy
  reportflow-nginx:
    image: nginx:alpine
    container_name: reportflow-nginx
    ports:
      - "8081:80"
      - "8443:443"
    volumes:
      - ./nginx-reportflow.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - reportflow-backend
    networks:
      - reportflow-network
    restart: unless-stopped

volumes:
  reportflow_postgres_data:

networks:
  reportflow-network:
    driver: bridge
