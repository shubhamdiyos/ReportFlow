services:
  # ReportFlow PostgreSQL Database
  reportflow-postgres:
    image: postgres:15-alpine
    container_name: reportflow-postgres
    environment:
      POSTGRES_DB: reportflow
      POSTGRES_USER: reportflow_user
      POSTGRES_PASSWORD: reportflow_password
    ports:
      - "5433:5432"  # Different port to avoid conflicts
    volumes:
      - reportflow_postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - reportflow-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reportflow_user -d reportflow"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  reportflow_postgres_data:

networks:
  reportflow-network:
    driver: bridge
