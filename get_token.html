<!DOCTYPE html>
<html>
<head>
    <title>Get JWT Token</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            background: #0066cc;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background: #0052a3;
        }
        #token {
            background: #f5f5f5;
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
            word-break: break-all;
            font-family: monospace;
        }
        #result {
            background: #e8f5e9;
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>ReportFlow - Fix Organization Sync</h1>
    
    <h2>Step 1: Get Token</h2>
    <p>Open http://localhost:5173 and press F12, then paste this in console:</p>
    <div id="token">localStorage.getItem('jwt_token')</div>
    
    <h2>Step 2: Paste Token Here</h2>
    <input type="text" id="tokenInput" placeholder="Paste your JWT token here" style="width: 100%; padding: 10px; font-size: 14px;">
    
    <h2>Step 3: Run Sync</h2>
    <button onclick="syncOrganizations()">Sync Organizations (Fix 403 Error)</button>
    
    <div id="result" style="display: none;"></div>

    <script>
        async function syncOrganizations() {
            const token = document.getElementById('tokenInput').value.trim();
            
            if (!token) {
                alert('Please paste your JWT token first!');
                return;
            }
            
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.textContent = 'Syncing organizations...';
            
            try {
                const response = await fetch('https://reportflow-c6lz.onrender.com/api/organizations/sync', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    resultDiv.style.background = '#e8f5e9';
                    resultDiv.textContent = `✅ SUCCESS!\n\n${JSON.stringify(result, null, 2)}\n\nNow refresh http://localhost:5173 and your repositories should load!`;
                } else {
                    resultDiv.style.background = '#ffebee';
                    resultDiv.textContent = `❌ ERROR:\n\n${JSON.stringify(result, null, 2)}`;
                }
            } catch (error) {
                resultDiv.style.background = '#ffebee';
                resultDiv.textContent = `❌ ERROR: ${error.message}`;
            }
        }
    </script>
</body>
</html>
