services:
  # Backend Service
  - type: web
    name: reportflow-backend
    runtime: java
    buildCommand: cd report_backend && mvn clean package -DskipTests
    startCommand: cd report_backend && java -jar target/reportflow-backend-1.0.0.jar
    envVars:
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: reportflow-db
          property: connectionString
      - key: SPRING_PROFILES_ACTIVE
        value: prod
    healthCheckPath: /api/auth/health
    
  # PostgreSQL Database
databases:
  - name: reportflow-db
    databaseName: reportflow
    user: reportflow_user
    plan: free
