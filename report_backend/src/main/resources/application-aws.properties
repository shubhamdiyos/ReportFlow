# AWS Production Configuration

# Server Configuration
server.port=${PORT:8080}

# Database Configuration (for AWS RDS PostgreSQL)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/reportflow}
spring.datasource.username=${DB_USERNAME:reportflow_user}
spring.datasource.password=${DB_PASSWORD:reportflow_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# JWT Configuration (secure 512-bit key for HS512)
app.jwt.secret=${JWT_SECRET:2YrMZR3BqiU6N18gcgfRX23cIiDiusL4TRbAq912uf5+lPiTPWW6y+vu7WD8Uex7GN5aRIPYsKvpsAvAbi1qxg==}
app.jwt.expiration=86400000

# GitHub OAuth Configuration
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email,read:org,repo
spring.security.oauth2.client.registration.github.redirect-uri=http://13.232.117.123:8080/api/auth/github/callback

# GitHub API Configuration
github.api.base-url=https://api.github.com
github.oauth.base-url=https://github.com/login/oauth

# CORS Configuration (Allow local frontend and AWS production)
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:*,http://127.0.0.1:*,https://reportflow-c6lz.onrender.com,http://65.0.109.47:3000,http://65.0.109.47:5000}
app.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true

# Logging Configuration
logging.level.com.reportflow=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN

# Application Configuration
spring.application.name=ReportFlow
app.frontend.url=${FRONTEND_URL:http://localhost:5000}
app.name=ReportFlow
app.version=1.0.0

# JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSS'Z'

# AWS-specific Configuration
cloud.aws.region.static=ap-south-1
cloud.aws.stack.auto=false
cloud.aws.credentials.instance-profile=true
