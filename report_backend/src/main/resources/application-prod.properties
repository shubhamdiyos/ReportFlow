# Production Configuration for Render

# Server Configuration
server.port=${PORT:8080}

# Database Configuration (Render provides DATABASE_URL in format: postgresql://user:pass@host/db)
# Spring Boot will automatically convert it to JDBC format
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/reportflow}
spring.datasource.username=${DB_USERNAME:reportflow_user}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# GitHub OAuth Configuration
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email,read:org,repo
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/api/auth/github/callback

# GitHub API Configuration
github.api.base-url=https://api.github.com
github.oauth.base-url=https://github.com/login/oauth

# CORS Configuration (Allow local frontend and production)
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:3000,http://localhost:8080}
app.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true

# Logging Configuration
logging.level.com.reportflow=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN

# Application Configuration
spring.application.name=ReportFlow

# JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
