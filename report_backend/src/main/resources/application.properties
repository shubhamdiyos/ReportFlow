# Server Configuration
server.port=8080
server.servlet.context-path=/

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/reportflow
spring.datasource.username=reportflow_user
spring.datasource.password=reportflow_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Security Configuration
app.jwt.secret=reportflow-jwt-secret-key-change-in-production
app.jwt.expiration=86400000

# GitHub OAuth Configuration
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:your-github-client-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:your-github-client-secret}
spring.security.oauth2.client.registration.github.scope=read:user,user:email,read:org,repo
spring.security.oauth2.client.registration.github.redirect-uri=https://reportflow-c6lz.onrender.com/api/auth/github/callback

# GitHub API Configuration
github.api.base-url=https://api.github.com
github.oauth.base-url=https://github.com/login/oauth

# CORS Configuration
app.cors.allowed-origins=http://localhost:5000,http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:5173,http://localhost:8080,http://localhost:9000,http://127.0.0.1:*
app.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true

# Logging Configuration
logging.level.com.reportflow=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# Application Configuration
app.frontend.url=http://localhost:5000
app.name=ReportFlow
app.version=1.0.0

# JSON Serialization Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
