<!DOCTYPE html>
<html>
<head>
    <title>Fix Organization Sync</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            background: #0066cc;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
            margin: 10px 0;
        }
        button:hover {
            background: #0052a3;
        }
        #result {
            background: #e8f5e9;
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
            white-space: pre-wrap;
        }
        .error {
            background: #ffebee !important;
        }
    </style>
</head>
<body>
    <h1>🔧 Fix ReportFlow Organization Sync</h1>
    
    <p>This will create the missing user-organization relationship and fix the 403 error.</p>
    
    <button onclick="fixSync()">Click Here to Fix 403 Error</button>
    
    <div id="result" style="display: none;"></div>

    <script>
        async function fixSync() {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.className = '';
            resultDiv.textContent = '⏳ Syncing organizations...';
            
            try {
                const token = localStorage.getItem('jwt_token');
                
                if (!token) {
                    resultDiv.className = 'error';
                    resultDiv.textContent = '❌ ERROR: No JWT token found. Please login first.';
                    return;
                }
                
                const response = await fetch('https://reportflow-c6lz.onrender.com/api/organizations/sync', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    resultDiv.textContent = `✅ SUCCESS!\n\nOrganizations synced: ${result.syncedOrganizations || 0}\nPersonal org: ${result.personalOrganization || 'Created'}\n\n${JSON.stringify(result, null, 2)}\n\n🎉 Now go back to the app and refresh the repositories page!`;
                    
                    setTimeout(() => {
                        if (confirm('Fix applied! Click OK to return to the app.')) {
                            window.location.href = '/onboarding/repositories';
                        }
                    }, 2000);
                } else {
                    resultDiv.className = 'error';
                    resultDiv.textContent = `❌ ERROR (${response.status}):\n\n${JSON.stringify(result, null, 2)}`;
                }
            } catch (error) {
                resultDiv.className = 'error';
                resultDiv.textContent = `❌ ERROR: ${error.message}`;
            }
        }
        
        // Auto-run on page load
        window.addEventListener('load', () => {
            console.log('Fix page loaded. Click the button to fix the 403 error.');
        });
    </script>
</body>
</html>
