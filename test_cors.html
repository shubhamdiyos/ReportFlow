<!DOCTYPE html>
<html>
<head>
    <title>CORS Test</title>
</head>
<body>
    <h1>Testing CORS with Production Backend</h1>
    <button onclick="testBackend()">Test Backend Connection</button>
    <div id="result"></div>

    <script>
        async function testBackend() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Testing...</p>';
            
            try {
                // Test health endpoint
                const healthResponse = await fetch('https://reportflow-c6lz.onrender.com/api/auth/health');
                const healthData = await healthResponse.json();
                
                // Test OAuth URL endpoint
                const oauthResponse = await fetch('https://reportflow-c6lz.onrender.com/api/auth/github/url');
                const oauthData = await oauthResponse.json();
                
                resultDiv.innerHTML = `
                    <h2>Success!</h2>
                    <h3>Health Check:</h3>
                    <pre>${JSON.stringify(healthData, null, 2)}</pre>
                    <h3>OAuth URL:</h3>
                    <pre>${JSON.stringify(oauthData, null, 2)}</pre>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <h2>Error!</h2>
                    <p style="color: red;">${error.message}</p>
                    <pre>${error.stack}</pre>
                `;
            }
        }
    </script>
</body>
</html>
